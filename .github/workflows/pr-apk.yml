name: PR APK Builder

on:
  issue_comment:
    types: [created]

jobs:
  build_apk:
    name: Build APK from PR Comment
    if: github.event.issue.pull_request && contains(github.event.comment.body, '!apk')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: React to comment
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket',
            });

      - name: Fetch Pull Request info
        id: pr_info
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            core.setOutput('head_ref', pr.head.ref);
            core.setOutput('head_sha', pr.head.sha);

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr_info.outputs.head_ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        id: upload_apk
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ steps.pr_info.outputs.head_sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Comment on PR with APK link
        uses: actions/github-script@v7
        with:
          script: |
            const artifactUrl = '${{ steps.upload_apk.outputs.artifact-url }}';
            const body = `✅ **APK Build Successful!**\n\nYou can download the debug APK here: [Download APK](${artifactUrl})`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
